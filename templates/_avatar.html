{# Small round profile photo, or the person's initials when there is no photo. #}
{% macro avatar(u, size=28) -%}
  {%- if u.photo -%}
    <img class="avatar" src="{{ url_for('profile_photo', uid=u.id) }}" alt="" width="{{ size }}" height="{{ size }}" style="width:{{ size }}px;height:{{ size }}px">
  {%- else -%}
    <span class="avatar initials" style="width:{{ size }}px;height:{{ size }}px;font-size:{{ (size * 0.4) | int }}px">{{ u.initials }}</span>
  {%- endif -%}
{%- endmacro %}
