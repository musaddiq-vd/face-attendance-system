{% extends "base.html" %}
{% block content %}
<h1>Change password</h1>
<p class="sub">Use at least 6 characters.</p>
<div class="card" style="max-width:420px">
  <form method="post">
    <div class="field"><label>Current password</label><input type="password" name="old" required></div>
    <div class="field"><label>New password</label><input type="password" name="new" minlength="6" required></div>
    <button class="btn">Save</button>
  </form>
</div>
{% endblock %}
